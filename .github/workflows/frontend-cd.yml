name: Frontend CI/CD

on:
  push:
    branches: [main, dev, staging, prod, 'release/**']
    tags: ['v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'
  pull_request:
    branches: [main, dev, staging, prod, 'release/**']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  resolve-deploy-target:
    name: 01 / Resolve Deploy Target
    runs-on: ubuntu-latest
    outputs:
      deploy_allowed: ${{ steps.target.outputs.deploy_allowed }}
      deploy_env: ${{ steps.target.outputs.deploy_env }}
      deploy_channel: ${{ steps.target.outputs.deploy_channel }}
      api_url: ${{ steps.target.outputs.api_url }}
    steps:
      - name: Resolve environment and public API URL
        id: target
        shell: bash
        env:
          DEV_API_URL: ${{ vars.DEV_VITE_API_URL }}
          STAGING_API_URL: ${{ vars.STAGING_VITE_API_URL }}
          PROD_API_URL: ${{ vars.PROD_VITE_API_URL }}
        run: |
          set -euo pipefail

          deploy_allowed="true"
          deploy_channel="branch"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            deploy_allowed="false"
            deploy_env="preview"
            deploy_channel="pull_request"
            api_url="${DEV_API_URL:-/api}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            deploy_env="prod"
            deploy_channel="release"
            api_url="${PROD_API_URL:-}"
          else
            case "${GITHUB_REF_NAME}" in
              dev)
                deploy_env="dev"
                api_url="${DEV_API_URL:-}"
                ;;
              staging)
                deploy_env="staging"
                api_url="${STAGING_API_URL:-}"
                ;;
              release/*)
                deploy_env="staging"
                deploy_channel="release"
                api_url="${STAGING_API_URL:-}"
                ;;
              main|prod)
                deploy_env="prod"
                api_url="${PROD_API_URL:-}"
                ;;
              *)
                deploy_allowed="false"
                deploy_env="none"
                api_url="/api"
                ;;
            esac
          fi

          if [[ "${deploy_allowed}" == "true" && -z "${api_url}" ]]; then
            echo "Configure the repository variable for ${deploy_env}: DEV_VITE_API_URL, STAGING_VITE_API_URL, or PROD_VITE_API_URL."
            exit 1
          fi

          {
            echo "deploy_allowed=${deploy_allowed}"
            echo "deploy_env=${deploy_env}"
            echo "deploy_channel=${deploy_channel}"
            echo "api_url=${api_url}"
          } >> "$GITHUB_OUTPUT"

  frontend-quality-build:
    name: 02 / Install, Audit, Typecheck & Build
    runs-on: ubuntu-latest
    needs: resolve-deploy-target
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ needs.resolve-deploy-target.outputs.api_url }}
      VITE_ALLOW_MOCK_PAYMENT: 'false'
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=high

      - name: Build Frontend
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  frontend-security-gate:
    name: 03 / Secret & Filesystem Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Frontend Filesystem Scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            aquasec/trivy:0.70.0 \
            fs --skip-version-check \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs frontend/node_modules \
            frontend

  frontend-deploy:
    name: 04 / Deploy Frontend To S3
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
    needs:
      - resolve-deploy-target
      - frontend-quality-build
      - frontend-security-gate
    if: github.event_name != 'pull_request' && needs.resolve-deploy-target.outputs.deploy_allowed == 'true'
    concurrency:
      group: frontend-deploy-${{ needs.resolve-deploy-target.outputs.deploy_env }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
      DEPLOY_CHANNEL: ${{ needs.resolve-deploy-target.outputs.deploy_channel }}
      API_URL: ${{ needs.resolve-deploy-target.outputs.api_url }}
      DEV_FRONTEND_S3_BUCKET: ${{ secrets.DEV_FRONTEND_S3_BUCKET }}
      STAGING_FRONTEND_S3_BUCKET: ${{ secrets.STAGING_FRONTEND_S3_BUCKET }}
      PROD_FRONTEND_S3_BUCKET: ${{ secrets.PROD_FRONTEND_S3_BUCKET }}
      FRONTEND_S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
      DEV_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }}
      STAGING_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
      PROD_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Download Frontend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Require AWS OIDC Role
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "Missing environment secret: AWS_DEPLOY_ROLE_ARN"
            exit 1
          fi

      - name: Configure AWS Credentials With OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ticketstage-frontend-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy, Smoke Test, And Roll Back On Failure
        shell: bash
        run: |
          set -Eeuo pipefail

          bucket="${FRONTEND_S3_BUCKET}"
          distribution_id="${CLOUDFRONT_DISTRIBUTION_ID}"
          case "${DEPLOY_ENV}" in
            dev)
              bucket="${DEV_FRONTEND_S3_BUCKET:-$bucket}"
              distribution_id="${DEV_CLOUDFRONT_DISTRIBUTION_ID:-$distribution_id}"
              ;;
            staging)
              bucket="${STAGING_FRONTEND_S3_BUCKET:-$bucket}"
              distribution_id="${STAGING_CLOUDFRONT_DISTRIBUTION_ID:-$distribution_id}"
              ;;
            prod)
              bucket="${PROD_FRONTEND_S3_BUCKET:-$bucket}"
              distribution_id="${PROD_CLOUDFRONT_DISTRIBUTION_ID:-$distribution_id}"
              ;;
          esac

          if [[ -z "$bucket" || -z "$distribution_id" ]]; then
            echo "Missing S3 bucket or CloudFront distribution for ${DEPLOY_ENV}. Run the infra pipeline first."
            exit 1
          fi

          had_previous_index="false"
          if aws s3 cp "s3://${bucket}/index.html" previous-index.html; then
            had_previous_index="true"
          fi

          rollback() {
            trap - ERR
            set +e
            echo "Frontend smoke test failed; restoring previous index.html"
            if [[ "$had_previous_index" == "true" ]]; then
              aws s3 cp previous-index.html "s3://${bucket}/index.html" \
                --cache-control "no-cache, no-store, must-revalidate" \
                --content-type "text/html"
              aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths "/*"
            fi
            exit 1
          }
          trap rollback ERR

          aws s3 sync dist/ "s3://${bucket}" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${bucket}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$distribution_id" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$distribution_id" --id "$invalidation_id"

          frontend_domain="$(aws cloudfront get-distribution \
            --id "$distribution_id" \
            --query 'Distribution.DomainName' \
            --output text)"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "https://${frontend_domain}/" >/dev/null

          api_root="${API_URL%/api}"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${api_root}/health/live" >/dev/null

          trap - ERR
          echo "Frontend and API smoke tests passed."
