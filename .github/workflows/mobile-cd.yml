name: Mobile CI/CD

on:
  push:
    branches: [main, dev, staging, prod, 'release/**']
    tags: ['mobile-v*']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-cd.yml'
  pull_request:
    branches: [main, dev, staging, prod, 'release/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-quality:
    name: 01 / Install, Audit & Expo Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Export NPM Audit Report
        run: npm audit --omit=dev --json > mobile-npm-audit.json || true

      - name: Block Critical Runtime Vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Upload NPM Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-npm-audit
          path: mobile/mobile-npm-audit.json
          retention-days: 14

      - name: Validate Expo Configuration
        run: npx expo config --type public >/dev/null

      - name: Export Web Bundle
        run: npx expo export --platform web --output-dir dist-ci

  android-debug-build:
    name: 02 / Build Android Debug APK
    runs-on: ubuntu-latest
    needs: mobile-quality
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ticketstage-android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  android-release-build:
    name: 03 / Build Signed Android App Bundle
    runs-on: ubuntu-latest
    needs:
      - mobile-quality
      - android-debug-build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v')
    environment: prod
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Enforce Production High-Severity Gate
        run: npm audit --omit=dev --audit-level=high

      - name: Require Android Signing Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing production environment secret: ${name}"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/ticketstage-release.keystore

      - name: Build Signed AAB
        env:
          ANDROID_KEYSTORE_FILE: ticketstage-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ticketstage-android-${{ github.ref_name }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
