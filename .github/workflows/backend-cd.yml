name: Backend CI/CD

on:
  push:
    branches:
      - main
      - dev
      - staging
      - prod
      - 'release/**'
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'
      - '.github/scripts/update-kustomize-image.sh'
  pull_request:
    branches:
      - main
      - dev
      - staging
      - prod
      - 'release/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'
      - '.github/scripts/update-kustomize-image.sh'
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to build/deploy, or all/auto.'
        required: false
        default: auto
        type: string

env:
  BACKEND_IMAGE_PLATFORM: linux/arm64

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  resolve-deploy-target:
    name: 01 / Resolve Deploy Target And Services
    runs-on: ubuntu-latest
    outputs:
      deploy_allowed: ${{ steps.target.outputs.deploy_allowed }}
      deploy_env: ${{ steps.target.outputs.deploy_env }}
      deploy_channel: ${{ steps.target.outputs.deploy_channel }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      short_sha: ${{ steps.target.outputs.short_sha }}
      safe_ref: ${{ steps.target.outputs.safe_ref }}
      service_matrix: ${{ steps.target.outputs.service_matrix }}
      service_names: ${{ steps.target.outputs.service_names }}
      service_count: ${{ steps.target.outputs.service_count }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve branch, image metadata, and affected services
        id: target
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_SERVICES: ${{ github.event.inputs.services || 'auto' }}
        run: |
          set -euo pipefail

          all_services=(api-gateway auth-service catalog-service booking-service checkin-service notification-service)

          deploy_allowed="true"
          deploy_env=""
          deploy_channel="branch"
          short_sha="${GITHUB_SHA::12}"
          safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            deploy_allowed="false"
            deploy_env="preview"
            deploy_channel="pull_request"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            deploy_env="prod"
            deploy_channel="release"
          else
            case "${GITHUB_REF_NAME}" in
              dev)
                deploy_env="dev"
                ;;
              staging)
                deploy_env="staging"
                ;;
              release/*)
                deploy_env="staging"
                deploy_channel="release"
                ;;
              main|prod)
                deploy_env="prod"
                ;;
              *)
                deploy_allowed="false"
                deploy_env="none"
                ;;
            esac
          fi

          image_tag="${deploy_env}-${short_sha}"

          contains_service() {
            local candidate="$1"
            for service in "${all_services[@]}"; do
              if [[ "$service" == "$candidate" ]]; then
                return 0
              fi
            done
            return 1
          }

          select_all_services() {
            selected_services=("${all_services[@]}")
          }

          is_global_backend_change() {
            local file="$1"
            case "$file" in
              .github/workflows/backend-cd.yml|.github/scripts/update-kustomize-image.sh|backend/Dockerfile|backend/package.json|backend/package-lock.json|backend/server.js|backend/routes/index.js)
                return 0
                ;;
              backend/config/*|backend/middleware/*|backend/shared/*|backend/utils/*|backend/scripts/*|backend/__tests__/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          affects_service() {
            local service="$1"
            local file="$2"
            case "$service" in
              api-gateway)
                [[ "$file" == backend/microservices/api-gateway/* ||
                  "$file" == backend/services/api-gateway/* ]]
                ;;
              auth-service)
                [[ "$file" == backend/microservices/auth-service/* ||
                  "$file" == backend/services/auth/* ||
                  "$file" == backend/routes/auth.js ||
                  "$file" == backend/routes/users.js ||
                  "$file" == backend/routes/admin.js ||
                  "$file" == backend/controllers/authController.js ||
                  "$file" == backend/controllers/userController.js ||
                  "$file" == backend/controllers/adminController.js ||
                  "$file" == backend/services/authService.js ||
                  "$file" == backend/services/userService.js ||
                  "$file" == backend/services/adminService.js ||
                  "$file" == backend/models/User.js ||
                  "$file" == backend/models/Session.js ]]
                ;;
              catalog-service)
                [[ "$file" == backend/microservices/catalog-service/* ||
                  "$file" == backend/services/catalog/* ||
                  "$file" == backend/routes/companies.js ||
                  "$file" == backend/routes/events.js ||
                  "$file" == backend/routes/tickets.js ||
                  "$file" == backend/routes/upload.js ||
                  "$file" == backend/routes/internal/catalog.js ||
                  "$file" == backend/controllers/companyController.js ||
                  "$file" == backend/controllers/eventController.js ||
                  "$file" == backend/controllers/ticketController.js ||
                  "$file" == backend/services/companyService.js ||
                  "$file" == backend/services/eventService.js ||
                  "$file" == backend/services/ticketService.js ||
                  "$file" == backend/services/catalogInventoryService.js ||
                  "$file" == backend/utils/mediaStorage.js ||
                  "$file" == backend/serializers/ticketSerializer.js ||
                  "$file" == backend/models/Company.js ||
                  "$file" == backend/models/Event.js ||
                  "$file" == backend/models/Ticket.js ||
                  "$file" == backend/models/SeatLock.js ]]
                ;;
              booking-service)
                [[ "$file" == backend/microservices/booking-service/* ||
                  "$file" == backend/services/booking/* ||
                  "$file" == backend/routes/bookings.js ||
                  "$file" == backend/routes/payment.js ||
                  "$file" == backend/routes/internal/booking.js ||
                  "$file" == backend/controllers/bookingController.js ||
                  "$file" == backend/controllers/passController.js ||
                  "$file" == backend/controllers/paymentController.js ||
                  "$file" == backend/services/bookingService.js ||
                  "$file" == backend/services/bookingExpirationService.js ||
                  "$file" == backend/services/catalogClient.js ||
                  "$file" == backend/services/eventReminderService.js ||
                  "$file" == backend/services/passService.js ||
                  "$file" == backend/services/paymentService.js ||
                  "$file" == backend/services/purchaseQueue.js ||
                  "$file" == backend/models/Booking.js ||
                  "$file" == backend/models/Payment.js ||
                  "$file" == backend/models/QueueSlot.js ||
                  "$file" == backend/models/RateLimitCounter.js ]]
                ;;
              checkin-service)
                [[ "$file" == backend/microservices/checkin-service/* ||
                  "$file" == backend/services/checkin/* ||
                  "$file" == backend/routes/checkin.js ||
                  "$file" == backend/routes/internal/checkin.js ||
                  "$file" == backend/controllers/checkinController.js ||
                  "$file" == backend/services/checkinService.js ||
                  "$file" == backend/models/CheckInDevice.js ||
                  "$file" == backend/models/CheckInLog.js ]]
                ;;
              notification-service)
                [[ "$file" == backend/microservices/notification-service/* ||
                  "$file" == backend/services/notification/* ||
                  "$file" == backend/routes/notifications.js ||
                  "$file" == backend/routes/internal/notifications.js ||
                  "$file" == backend/services/emailQueueService.js ||
                  "$file" == backend/services/notificationEventService.js ||
                  "$file" == backend/utils/emailService.js ||
                  "$file" == backend/templates/* ||
                  "$file" == backend/models/EmailJob.js ||
                  "$file" == backend/models/EmailLog.js ||
                  "$file" == backend/models/EmailPreference.js ||
                  "$file" == backend/models/EmailSuppression.js ||
                  "$file" == backend/models/EmailTemplate.js ||
                  "$file" == backend/models/MarketingCampaign.js ]]
                ;;
            esac
          }

          selected_services=()

          if [[ "${MANUAL_SERVICES}" != "auto" && "${MANUAL_SERVICES}" != "all" ]]; then
            IFS=',' read -ra requested_services <<< "${MANUAL_SERVICES}"
            for requested in "${requested_services[@]}"; do
              service="$(echo "$requested" | xargs)"
              if ! contains_service "$service"; then
                echo "Unknown service requested: ${service}"
                echo "Allowed services: ${all_services[*]}"
                exit 1
              fi
              selected_services+=("$service")
            done
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            select_all_services
          else
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              mapfile -t changed_files < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
            elif [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
              select_all_services
              changed_files=()
            else
              mapfile -t changed_files < <(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")
            fi

            if [[ "${#selected_services[@]}" -eq 0 ]]; then
              declare -A selected=()
              unknown_backend_change="false"

              for file in "${changed_files[@]}"; do
                if is_global_backend_change "$file"; then
                  select_all_services
                  break
                fi

                if [[ "$file" == backend/* ]]; then
                  matched="false"
                  for service in "${all_services[@]}"; do
                    if affects_service "$service" "$file"; then
                      selected["$service"]=1
                      matched="true"
                    fi
                  done

                  if [[ "$matched" == "false" ]]; then
                    unknown_backend_change="true"
                  fi
                fi
              done

              if [[ "${#selected_services[@]}" -eq 0 ]]; then
                if [[ "$unknown_backend_change" == "true" ]]; then
                  select_all_services
                else
                  for service in "${all_services[@]}"; do
                    if [[ -n "${selected[$service]:-}" ]]; then
                      selected_services+=("$service")
                    fi
                  done
                fi
              fi
            fi
          fi

          if [[ "${#selected_services[@]}" -eq 0 ]]; then
            select_all_services
          fi

          service_matrix="$(
            printf '%s\n' "${selected_services[@]}" | jq -R . | jq -cs '
              map({
                service: .,
                local_image: ("ticket-booking-" + .),
                dockerfile: (
                  if . == "api-gateway" then "services/api-gateway/Dockerfile"
                  elif . == "auth-service" then "services/auth/Dockerfile"
                  elif . == "catalog-service" then "services/catalog/Dockerfile"
                  elif . == "booking-service" then "services/booking/Dockerfile"
                  elif . == "checkin-service" then "services/checkin/Dockerfile"
                  else "services/notification/Dockerfile"
                  end
                )
              })
            '
          )"
          service_names="$(printf '%s ' "${selected_services[@]}" | sed 's/[[:space:]]$//')"

          {
            echo "deploy_allowed=${deploy_allowed}"
            echo "deploy_env=${deploy_env}"
            echo "deploy_channel=${deploy_channel}"
            echo "image_tag=${image_tag}"
            echo "short_sha=${short_sha}"
            echo "safe_ref=${safe_ref}"
            echo "service_matrix=${service_matrix}"
            echo "service_names=${service_names}"
            echo "service_count=${#selected_services[@]}"
          } >> "$GITHUB_OUTPUT"

          echo "Selected services: ${service_names}"

  backend-quality:
    name: 02 / Backend Install, Audit & Test
    runs-on: ubuntu-latest
    needs: resolve-deploy-target
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=high

      - name: Run Tests
        run: npm test

  backend-security-gate:
    name: 03 / Secret & Filesystem Security Gate
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Backend Filesystem Scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            aquasec/trivy:0.70.0 \
            fs --skip-version-check \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs backend/node_modules \
            backend

  backend-image-build:
    name: 04 / Build Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - resolve-deploy-target
      - backend-quality
      - backend-security-gate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-deploy-target.outputs.service_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Service Docker Image
        env:
          IMAGE_TAG: ${{ needs.resolve-deploy-target.outputs.image_tag }}
          LOCAL_IMAGE: ${{ matrix.local_image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail

          docker buildx build \
            --platform "${BACKEND_IMAGE_PLATFORM}" \
            --load \
            --pull \
            -f "backend/${DOCKERFILE}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            -t "${LOCAL_IMAGE}:${IMAGE_TAG}" \
            -t "${LOCAL_IMAGE}:audit" \
            backend

      - name: Save Service Image Artifact
        env:
          LOCAL_IMAGE: ${{ matrix.local_image }}
          SERVICE: ${{ matrix.service }}
        run: docker save "${LOCAL_IMAGE}:audit" -o "${SERVICE}-image.tar"

      - name: Upload Service Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ matrix.service }}
          path: ${{ matrix.service }}-image.tar
          retention-days: 1

  backend-image-scan:
    name: 05 / Scan Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - resolve-deploy-target
      - backend-image-build
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-deploy-target.outputs.service_matrix) }}
    steps:
      - name: Download Service Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ matrix.service }}

      - name: Load Service Image
        run: docker load -i "${{ matrix.service }}-image.tar"

      - name: Trivy Service Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.local_image }}:audit
          scanners: vuln
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  backend-image-push:
    name: 06 / Push Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - resolve-deploy-target
      - backend-image-scan
    if: github.event_name != 'pull_request' && needs.resolve-deploy-target.outputs.deploy_allowed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-deploy-target.outputs.service_matrix) }}
    steps:
      - name: Download Service Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ matrix.service }}

      - name: Load Service Image
        run: docker load -i "${{ matrix.service }}-image.tar"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ticketstage-backend-push-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Service Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ secrets.BACKEND_ECR_REPOSITORY_PREFIX }}
          IMAGE_TAG: ${{ needs.resolve-deploy-target.outputs.image_tag }}
          LOCAL_IMAGE: ${{ matrix.local_image }}
          SAFE_REF: ${{ needs.resolve-deploy-target.outputs.safe_ref }}
          SHORT_SHA: ${{ needs.resolve-deploy-target.outputs.short_sha }}
          DEPLOY_ENV: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          repository_prefix="${ECR_REPOSITORY_PREFIX:-${DEPLOY_ENV}}"
          repository_prefix="${repository_prefix%/}"
          image_uri="${ECR_REGISTRY}/${repository_prefix}/${SERVICE}"

          tags=(
            "${image_uri}:${IMAGE_TAG}"
            "${image_uri}:sha-${SHORT_SHA}"
          )

          if [[ "${SAFE_REF}" != "${DEPLOY_ENV}" ]]; then
            tags+=("${image_uri}:${SAFE_REF}-${SHORT_SHA}")
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            tags+=("${image_uri}:${GITHUB_REF_NAME}")
          fi

          for tag in "${tags[@]}"; do
            docker tag "${LOCAL_IMAGE}:audit" "$tag"
            docker push "$tag"
          done

  backend-predeploy-migrate:
    name: 07 / Run Idempotent Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
    needs:
      - resolve-deploy-target
      - backend-image-push
    if: github.event_name != 'pull_request' && needs.resolve-deploy-target.outputs.deploy_allowed == 'true'
    concurrency:
      group: backend-migration-${{ needs.resolve-deploy-target.outputs.deploy_env }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
      IMAGE_TAG: ${{ needs.resolve-deploy-target.outputs.image_tag }}
      SHORT_SHA: ${{ needs.resolve-deploy-target.outputs.short_sha }}
      SERVICE_NAMES: ${{ needs.resolve-deploy-target.outputs.service_names }}
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'ticketstage' }}
      RUN_INVENTORY_BUCKET_MIGRATION: ${{ vars.ENABLE_INVENTORY_BUCKET_MIGRATION || 'false' }}
    steps:
      - name: Resolve Migration Targets
        id: migration-target
        shell: bash
        run: |
          if [[ " ${SERVICE_NAMES} " == *" booking-service "* || " ${SERVICE_NAMES} " == *" catalog-service "* ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No service with database migrations changed; skipping migration jobs."
          fi

      - name: Configure AWS Credentials With OIDC
        if: steps.migration-target.outputs.required == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ticketstage-backend-migrate-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.migration-target.outputs.required == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        if: steps.migration-target.outputs.required == 'true'
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Run Service Database Migration Jobs
        if: steps.migration-target.outputs.required == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ secrets.BACKEND_ECR_REPOSITORY_PREFIX }}
        shell: bash
        run: |
          set -euo pipefail

          repository_prefix="${ECR_REPOSITORY_PREFIX:-${DEPLOY_ENV}}"
          repository_prefix="${repository_prefix%/}"
          run_migration() {
            local service_name="$1"
            local job_name="$2"
            local script_path="$3"
            local migration_image="${ECR_REGISTRY}/${repository_prefix}/${service_name}:${IMAGE_TAG}"

            kubectl -n "$K8S_NAMESPACE" delete job "$job_name" --ignore-not-found
            kubectl -n "$K8S_NAMESPACE" get deployment "$service_name" -o json | \
              jq --arg job "$job_name" --arg image "$migration_image" --arg script "$script_path" --arg service "$service_name" '
              {
                apiVersion: "batch/v1",
                kind: "Job",
                metadata: {
                  name: $job,
                  labels: {"app.kubernetes.io/name": ($service + "-migration")}
                },
                spec: {
                  backoffLimit: 1,
                  ttlSecondsAfterFinished: 600,
                  template: {
                    metadata: {labels: {"app.kubernetes.io/name": ($service + "-migration")}},
                    spec: {
                      restartPolicy: "Never",
                      serviceAccountName: .spec.template.spec.serviceAccountName,
                      imagePullSecrets: (.spec.template.spec.imagePullSecrets // []),
                      containers: [{
                        name: "migration",
                        image: $image,
                        imagePullPolicy: "IfNotPresent",
                        command: ["node", $script],
                        env: (.spec.template.spec.containers[0].env // []),
                        envFrom: (.spec.template.spec.containers[0].envFrom // [])
                      }]
                    }
                  }
                }
              }
              ' | kubectl -n "$K8S_NAMESPACE" apply -f -

            if ! kubectl -n "$K8S_NAMESPACE" wait --for=condition=complete "job/${job_name}" --timeout=300s; then
              kubectl -n "$K8S_NAMESPACE" logs "job/${job_name}" --all-containers=true || true
              return 1
            fi

            kubectl -n "$K8S_NAMESPACE" logs "job/${job_name}" --all-containers=true
          }

          if [[ " ${SERVICE_NAMES} " == *" booking-service "* ]]; then
            run_migration "booking-service" "payment-index-${SHORT_SHA}" "scripts/migratePaymentIndexes.js"
          fi

          if [[ " ${SERVICE_NAMES} " == *" catalog-service "* ]]; then
            run_migration "catalog-service" "inventory-reservation-index-${SHORT_SHA}" "scripts/migrateInventoryReservationIndexes.js"
            if [[ "${RUN_INVENTORY_BUCKET_MIGRATION}" == "true" ]]; then
              run_migration "catalog-service" "inventory-bucket-${SHORT_SHA}" "scripts/migrateInventoryBuckets.js"
              run_migration "catalog-service" "inventory-bucket-sync-${SHORT_SHA}" "scripts/syncInventoryBucketSummaries.js"
            fi
          fi

  backend-deploy:
    name: 09 / Verify GitOps Rollout (${{ matrix.service }})
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
    needs:
      - resolve-deploy-target
      - backend-gitops-update
    if: github.event_name != 'pull_request' && needs.resolve-deploy-target.outputs.deploy_allowed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-deploy-target.outputs.service_matrix) }}
    concurrency:
      group: backend-deploy-${{ github.ref_name }}-${{ matrix.service }}
      cancel-in-progress: true
    env:
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'ticketstage' }}
      IMAGE_TAG: ${{ needs.resolve-deploy-target.outputs.image_tag }}
      DEPLOY_ENV: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
      DEPLOY_CHANNEL: ${{ needs.resolve-deploy-target.outputs.deploy_channel }}
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ticketstage-backend-verify-${{ github.run_id }}-${{ matrix.service }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Wait For Argo CD Rollout
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ secrets.BACKEND_ECR_REPOSITORY_PREFIX }}
        run: |
          set -euo pipefail

          repository_prefix="${ECR_REPOSITORY_PREFIX:-${DEPLOY_ENV}}"
          repository_prefix="${repository_prefix%/}"
          expected_image="${ECR_REGISTRY}/${repository_prefix}/${SERVICE}:${IMAGE_TAG}"

          echo "Waiting for Argo CD: service=${SERVICE} env=${DEPLOY_ENV} image=${expected_image}"

          observed_image=""
          for attempt in $(seq 1 36); do
            observed_image="$(kubectl -n "$K8S_NAMESPACE" get deployment "$SERVICE" -o "jsonpath={.spec.template.spec.containers[?(@.name=='${SERVICE}')].image}")"
            if [ "$observed_image" = "$expected_image" ]; then
              break
            fi
            echo "Attempt ${attempt}/36: observed=${observed_image:-missing}"
            sleep 10
          done

          if [ "$observed_image" != "$expected_image" ]; then
            echo "Argo CD did not apply the expected image. Roll back by reverting the infra GitOps commit."
            exit 1
          fi

          kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${SERVICE}" --timeout=300s

  backend-gitops-update:
    name: 08 / Update GitOps Image Tags
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
    outputs:
      gitops_commit: ${{ steps.commit.outputs.gitops_commit }}
      infra_branch: ${{ steps.infra-target.outputs.branch }}
    needs:
      - resolve-deploy-target
      - backend-image-push
      - backend-predeploy-migrate
    if: github.event_name != 'pull_request' && needs.resolve-deploy-target.outputs.deploy_allowed == 'true'
    concurrency:
      group: backend-gitops-${{ needs.resolve-deploy-target.outputs.deploy_env == 'prod' && 'main' || 'dev' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
      IMAGE_TAG: ${{ needs.resolve-deploy-target.outputs.image_tag }}
      SERVICE_NAMES: ${{ needs.resolve-deploy-target.outputs.service_names }}
      INFRA_REPOSITORY: ${{ secrets.INFRA_REPOSITORY }}
      INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
    steps:
      - name: Require GitOps Configuration
        run: |
          set -euo pipefail
          if [ -z "$INFRA_REPOSITORY" ] || [ -z "$INFRA_REPO_TOKEN" ]; then
            echo "INFRA_REPOSITORY and INFRA_REPO_TOKEN are required for GitOps deployment."
            exit 1
          fi

      - name: Resolve Infra Branch
        id: infra-target
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENV" = "prod" ]; then
            branch="main"
          else
            branch="dev"
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Checkout App Repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          token: ${{ env.INFRA_REPO_TOKEN }}
          ref: ${{ steps.infra-target.outputs.branch }}
          path: infra

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ticketstage-gitops-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Kustomize Image Tags
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ secrets.BACKEND_ECR_REPOSITORY_PREFIX }}
        run: |
          set -euo pipefail

          overlay="infra/k8s/overlays/${DEPLOY_ENV}/kustomization.yaml"
          repository_prefix="${ECR_REPOSITORY_PREFIX:-${DEPLOY_ENV}}"
          repository_prefix="${repository_prefix%/}"

          chmod +x app/.github/scripts/update-kustomize-image.sh

          for service in ${SERVICE_NAMES}; do
            image_name="${ECR_REGISTRY}/${repository_prefix}/${service}"
            app/.github/scripts/update-kustomize-image.sh "$overlay" "$service" "$image_name" "$IMAGE_TAG"
          done

      - name: Commit And Push GitOps Image Tags
        id: commit
        working-directory: infra
        env:
          INFRA_BRANCH: ${{ steps.infra-target.outputs.branch }}
        run: |
          set -euo pipefail

          if git diff --quiet -- "k8s/overlays/${DEPLOY_ENV}/kustomization.yaml"; then
            echo "No GitOps image tag changes to commit."
            echo "gitops_commit=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "ticketstage-ci"
          git config user.email "ticketstage-ci@users.noreply.github.com"
          git add "k8s/overlays/${DEPLOY_ENV}/kustomization.yaml"
          git commit \
            -m "chore(gitops): deploy backend ${DEPLOY_ENV} ${IMAGE_TAG}" \
            -m "Services: ${SERVICE_NAMES}" \
            -m "Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin "HEAD:${INFRA_BRANCH}"
          echo "gitops_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backend-smoke-test:
    name: 10 / Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
    needs:
      - resolve-deploy-target
      - backend-deploy
    if: github.event_name != 'pull_request' && needs.resolve-deploy-target.outputs.deploy_allowed == 'true'
    env:
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'ticketstage' }}
    steps:
      - name: Configure AWS Credentials With OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ticketstage-backend-smoke-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Verify Gateway Health
        shell: bash
        run: |
          set -euo pipefail

          public_api_url="$(kubectl -n "$K8S_NAMESPACE" get configmap ticketstage-config -o jsonpath='{.data.PUBLIC_API_URL}')"
          if [[ -z "$public_api_url" ]]; then
            echo "PUBLIC_API_URL is missing from ticketstage-config"
            exit 1
          fi

          curl --fail --silent --show-error --retry 6 --retry-delay 5 "${public_api_url%/}/health/live" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "${public_api_url%/}/health/ready" >/dev/null
          echo "Backend smoke tests passed at ${public_api_url}."

  backend-gitops-rollback:
    name: 11 / Revert GitOps Commit On Failure
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy-target.outputs.deploy_env }}
    needs:
      - resolve-deploy-target
      - backend-gitops-update
      - backend-deploy
      - backend-smoke-test
    if: >-
      always() &&
      needs.resolve-deploy-target.outputs.deploy_allowed == 'true' &&
      needs.backend-gitops-update.outputs.gitops_commit != '' &&
      (needs.backend-deploy.result == 'failure' || needs.backend-smoke-test.result == 'failure')
    concurrency:
      group: backend-gitops-${{ needs.resolve-deploy-target.outputs.deploy_env == 'prod' && 'main' || 'dev' }}
      cancel-in-progress: false
    env:
      INFRA_REPOSITORY: ${{ secrets.INFRA_REPOSITORY }}
      INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
      INFRA_BRANCH: ${{ needs.backend-gitops-update.outputs.infra_branch }}
      GITOPS_COMMIT: ${{ needs.backend-gitops-update.outputs.gitops_commit }}
    steps:
      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          token: ${{ env.INFRA_REPO_TOKEN }}
          ref: ${{ env.INFRA_BRANCH }}
          fetch-depth: 0

      - name: Revert Failed Deployment
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ticketstage-ci"
          git config user.email "ticketstage-ci@users.noreply.github.com"
          git pull --ff-only origin "$INFRA_BRANCH"

          if ! git merge-base --is-ancestor "$GITOPS_COMMIT" HEAD; then
            echo "GitOps commit ${GITOPS_COMMIT} is not on ${INFRA_BRANCH}; refusing an unsafe rollback."
            exit 1
          fi

          git revert --no-edit "$GITOPS_COMMIT"
          git push origin "HEAD:${INFRA_BRANCH}"
          echo "Reverted failed GitOps deployment ${GITOPS_COMMIT}."
