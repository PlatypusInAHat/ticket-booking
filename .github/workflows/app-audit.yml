name: App Cross-Cutting Audit

on:
  push:
    branches: [main, dev, staging, prod, 'release/**']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'docker-compose.yml'
      - 'sonar-project.properties'
      - 'dependency-check-suppressions.xml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, dev, staging, prod, 'release/**']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'docker-compose.yml'
      - 'sonar-project.properties'
      - 'dependency-check-suppressions.xml'
      - '.github/workflows/**'

permissions:
  contents: read
  security-events: write

jobs:
  workflow-lint:
    name: 01 / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: GitHub Actions Lint
        uses: raven-actions/actionlint@v2

  secret-scan:
    name: 02 / Secret Scan
    runs-on: ubuntu-latest
    needs: workflow-lint
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-filesystem:
    name: 03 / Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: workflow-lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Trivy Filesystem Scan
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            aquasec/trivy:0.70.0 \
            fs \
            --skip-version-check \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-app-results.sarif \
            --exit-code 1 \
            --skip-dirs .git \
            --skip-dirs backend/node_modules \
            --skip-dirs frontend/node_modules \
            --skip-dirs mobile/node_modules \
            --skip-dirs backend/coverage \
            --skip-dirs frontend/coverage \
            --skip-dirs mobile/coverage \
            .
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-app-results.sarif

  owasp-dependency-check:
    name: 04 / OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: workflow-lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: OWASP Dependency Check
        run: |
          mkdir -p dependency-check-report
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/dependency-check-report:/report" \
            owasp/dependency-check:12.2.2 \
            --project ticket-booking-app \
            --scan /src \
            --format HTML \
            --out /report \
            --enableExperimental \
            --failOnCVSS 7 \
            --suppression /src/dependency-check-suppressions.xml \
            --exclude "**/node_modules/**"
      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: dependency-check-report
          if-no-files-found: ignore

  sonarqube-scan:
    name: 05 / SonarQube Scan
    runs-on: ubuntu-latest
    needs: [secret-scan, trivy-filesystem, owasp-dependency-check]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
      - name: SonarQube Quality Gate
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
      - name: Skip SonarQube
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: echo "SonarQube secrets are not configured; skipping scan."

  audit-summary:
    name: 06 / Audit Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [secret-scan, trivy-filesystem, owasp-dependency-check, sonarqube-scan]
    steps:
      - name: Print Result Summary
        run: |
          echo "Secret scan: ${{ needs.secret-scan.result }}"
          echo "Trivy filesystem: ${{ needs.trivy-filesystem.result }}"
          echo "OWASP dependency check: ${{ needs.owasp-dependency-check.result }}"
          echo "SonarQube: ${{ needs.sonarqube-scan.result }}"
      - name: Fail If Required Stage Failed
        if: contains(join(needs.*.result, ','), 'failure') || contains(join(needs.*.result, ','), 'cancelled')
        run: exit 1
