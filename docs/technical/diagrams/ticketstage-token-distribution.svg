<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2450" viewBox="0 0 2600 2450" role="img"><title>Admission token được cấp và phân phối như thế nào?</title><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#28649d"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d3750e"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#218167"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#7850ad"/></marker><marker id="pink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#b6417c"/></marker></defs><rect width="2600" height="2450" fill="white"/><g font-family="Segoe UI,DejaVu Sans,sans-serif">
<text x="50" y="55" font-size="22" fill="#d3750e" font-weight="700">TICKETSTAGE / ARCHITECTURE DETAILS</text>
<text x="50" y="109" font-size="40" fill="#172b45" font-weight="700">Admission token được cấp và phân phối như thế nào?</text>
<text x="50" y="147" font-size="22" fill="#53677e" font-weight="400">Pull-based admission • không push token qua RabbitMQ • mọi replica dùng chung Redis state và signing secret</text>
<rect x="50" y="190" width="790" height="110" rx="10" fill="#f8fbfd" stroke="#28649d" stroke-width="1.6"/>
<rect x="64" y="210" width="46" height="46" rx="5" fill="#28649d"/><path d="M74 222h26v22h-26zM80 218v30m14-30v30" fill="none" stroke="white" stroke-width="2"/>
<text x="125" y="227" font-size="22" fill="#172b45" font-weight="700">Auth access token · 15 phút mặc định</text>
<text x="125" y="257" font-size="19" fill="#53677e" font-weight="400">Auth service cấp; Authorization: Bearer &lt;authToken&gt;</text>
<text x="125" y="283" font-size="19" fill="#53677e" font-weight="400">Chứng minh người dùng, không thay cho quyền vào checkout</text>
<rect x="905" y="190" width="760" height="110" rx="10" fill="#f8fbfd" stroke="#d3750e" stroke-width="1.6"/>
<rect x="919" y="210" width="46" height="46" rx="5" fill="#d3750e"/><path d="M929 222h26v22h-26zM935 218v30m14-30v30" fill="none" stroke="white" stroke-width="2"/>
<text x="980" y="227" font-size="22" fill="#172b45" font-weight="700">Entry token · opaque ID</text>
<text x="980" y="257" font-size="19" fill="#53677e" font-weight="400">24 byte ngẫu nhiên, base64url; trả về khi join</text>
<text x="980" y="283" font-size="19" fill="#53677e" font-weight="400">Tra cứu phiên chờ; entry TTL mặc định 3.600 giây</text>
<rect x="1730" y="190" width="820" height="110" rx="10" fill="#f8fbfd" stroke="#218167" stroke-width="1.6"/>
<rect x="1744" y="210" width="46" height="46" rx="5" fill="#218167"/><path d="M1754 222h26v22h-26zM1760 218v30m14-30v30" fill="none" stroke="white" stroke-width="2"/>
<text x="1805" y="227" font-size="22" fill="#172b45" font-weight="700">Admission JWT · 600 giây mỗi lần ký</text>
<text x="1805" y="257" font-size="19" fill="#53677e" font-weight="400">Waiting room cấp; x-waiting-room-token</text>
<text x="1805" y="283" font-size="19" fill="#53677e" font-weight="400">Gateway xác minh; entryId chỉ tạo được một booking</text>
<rect x="60" y="355" width="270" height="75" rx="10" fill="#f8fbfd" stroke="#28649d" stroke-width="1.6"/>
<text x="80" y="387" font-size="23" fill="#28649d" font-weight="700">Website</text>
<polyline points="195,430 195,1660" fill="none" stroke="#28649d" stroke-width="2.2" stroke-dasharray="8 6"/>
<rect x="485" y="355" width="270" height="75" rx="10" fill="#f8fbfd" stroke="#28649d" stroke-width="1.6"/>
<text x="505" y="387" font-size="23" fill="#28649d" font-weight="700">API Gateway</text>
<polyline points="620,430 620,1660" fill="none" stroke="#28649d" stroke-width="2.2" stroke-dasharray="8 6"/>
<rect x="910" y="355" width="270" height="75" rx="10" fill="#f8fbfd" stroke="#28649d" stroke-width="1.6"/>
<text x="930" y="387" font-size="23" fill="#28649d" font-weight="700">Waiting Room</text>
<polyline points="1045,430 1045,1660" fill="none" stroke="#28649d" stroke-width="2.2" stroke-dasharray="8 6"/>
<rect x="1335" y="355" width="270" height="75" rx="10" fill="#f8fbfd" stroke="#7850ad" stroke-width="1.6"/>
<text x="1355" y="387" font-size="23" fill="#7850ad" font-weight="700">Redis chung</text>
<polyline points="1470,430 1470,1660" fill="none" stroke="#7850ad" stroke-width="2.2" stroke-dasharray="8 6"/>
<rect x="1760" y="355" width="270" height="75" rx="10" fill="#f8fbfd" stroke="#28649d" stroke-width="1.6"/>
<text x="1780" y="387" font-size="23" fill="#28649d" font-weight="700">Booking</text>
<polyline points="1895,430 1895,1660" fill="none" stroke="#28649d" stroke-width="2.2" stroke-dasharray="8 6"/>
<rect x="2185" y="355" width="270" height="75" rx="10" fill="#f8fbfd" stroke="#28649d" stroke-width="1.6"/>
<text x="2205" y="387" font-size="23" fill="#28649d" font-weight="700">Catalog / Mongo</text>
<polyline points="2320,430 2320,1660" fill="none" stroke="#28649d" stroke-width="2.2" stroke-dasharray="8 6"/>
<polyline points="195,480 620,480" fill="none" stroke="#28649d" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="210" y="467" font-size="20" fill="#28649d" font-weight="600">1 · POST /api/waiting-room/join</text>
<text x="210" y="507" font-size="18" fill="#53677e" font-weight="400">Auth token + eventIds + deviceFingerprint</text>
<polyline points="620,554 1045,554" fill="none" stroke="#28649d" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="635" y="541" font-size="20" fill="#28649d" font-weight="600">Forward /join</text>
<text x="635" y="581" font-size="18" fill="#53677e" font-weight="400">Service xác thực JWT đăng nhập</text>
<polyline points="1045,628 1470,628" fill="none" stroke="#d3750e" stroke-width="2.2" marker-end="url(#orange)"/>
<text x="1060" y="615" font-size="20" fill="#d3750e" font-weight="600">2 · Lưu entry + ZADD queue</text>
<text x="1060" y="655" font-size="18" fill="#53677e" font-weight="400">Identity: user + fingerprint + event set</text>
<polyline points="1045,702 195,702" fill="none" stroke="#d3750e" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#orange)"/>
<text x="210" y="689" font-size="20" fill="#d3750e" font-weight="600">202 · { entryToken, campaignId }</text>
<text x="210" y="729" font-size="18" fill="#53677e" font-weight="400">Response đi ngược qua gateway; client giữ entryToken trong luồng checkout</text>
<polyline points="195,793 1045,793" fill="none" stroke="#28649d" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="210" y="780" font-size="20" fill="#28649d" font-weight="600">3 · GET /api/waiting-room/{entryToken}/status qua gateway</text>
<text x="210" y="820" font-size="18" fill="#53677e" font-weight="400">Client polling mỗi 5 giây khi còn waiting</text>
<polyline points="1045,875 1470,875" fill="none" stroke="#7850ad" stroke-width="2.2" marker-end="url(#purple)"/>
<text x="1060" y="862" font-size="20" fill="#7850ad" font-weight="600">4 · Lua eval atomic</text>
<text x="1060" y="902" font-size="18" fill="#53677e" font-weight="400">Kiểm tra rank / active / recent; cấp lease</text>
<polyline points="1470,949 1045,949" fill="none" stroke="#7850ad" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#purple)"/>
<text x="1060" y="936" font-size="20" fill="#7850ad" font-weight="600">waiting hoặc admitted</text>
<text x="1060" y="976" font-size="18" fill="#53677e" font-weight="400">Không có worker tự push token cho client</text>
<polyline points="1045,1030 195,1030" fill="none" stroke="#218167" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#green)"/>
<text x="210" y="1017" font-size="20" fill="#218167" font-weight="600">5 · admitted → ký JWT → response { accessToken, expiresIn }</text>
<text x="210" y="1057" font-size="18" fill="#53677e" font-weight="400">Chỉ client đang poll nhận token; đi qua gateway; status response có Cache-Control: no-store</text>
<polyline points="195,1125 620,1125" fill="none" stroke="#218167" stroke-width="2.2" marker-end="url(#green)"/>
<text x="210" y="1112" font-size="20" fill="#218167" font-weight="600">6 · POST /api/bookings</text>
<text x="210" y="1152" font-size="18" fill="#53677e" font-weight="400">Auth Bearer + x-waiting-room-token</text>
<rect x="480" y="1167" width="790" height="76" rx="10" fill="#fffbf4" stroke="#d3750e" stroke-width="1.6" stroke-dasharray="10 6"/>
<text x="499" y="1195" font-size="20" fill="#d3750e" font-weight="600">Gateway: chữ ký + iss + aud + exp + userId trùng auth JWT</text>
<text x="499" y="1224" font-size="19" fill="#53677e" font-weight="400">Không gọi Redis để kiểm tra lease/revoke ở request booking hiện tại</text>
<polyline points="620,1294 1895,1294" fill="none" stroke="#218167" stroke-width="2.2" marker-end="url(#green)"/>
<text x="635" y="1281" font-size="20" fill="#218167" font-weight="600">7 · Forward booking + x-waiting-room-entry-id + x-waiting-room-event-ids</text>
<text x="635" y="1321" font-size="18" fill="#53677e" font-weight="400">Những header này mang kết quả xác minh tại gateway</text>
<polyline points="1895,1381 2320,1381" fill="none" stroke="#28649d" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="1910" y="1368" font-size="20" fill="#28649d" font-weight="600">8 · Reserve tồn kho atomic</text>
<text x="1910" y="1408" font-size="18" fill="#53677e" font-weight="400">Catalog trả event thật / reservation</text>
<rect x="1760" y="1422" width="780" height="111" rx="10" fill="#f8fbfd" stroke="#218167" stroke-width="1.6"/>
<text x="1780" y="1451" font-size="20" fill="#53677e" font-weight="400">9 · Booking kiểm tra event đã được admission;</text>
<text x="1780" y="1480" font-size="20" fill="#53677e" font-weight="400">save booking + outbox trong Mongo transaction;</text>
<text x="1780" y="1509" font-size="20" fill="#53677e" font-weight="400">unique index entryId ngăn admission tạo booking thứ hai.</text>
<polyline points="1895,1591 195,1591" fill="none" stroke="#218167" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#green)"/>
<text x="210" y="1578" font-size="20" fill="#218167" font-weight="600">201 Booking → tạo phiên thanh toán → redirect VNPay/MoMo</text>
<text x="210" y="1618" font-size="18" fill="#53677e" font-weight="400">Trả về qua gateway; payment webhook xác nhận thanh toán sau đó</text>
<rect x="50" y="1705" width="790" height="303" rx="10" fill="#f8fbfd" stroke="#7850ad" stroke-width="1.6"/>
<text x="70" y="1737" font-size="23" fill="#7850ad" font-weight="700">ĐIỀU KIỆN ADMISSION TRONG LUA</text>
<text x="73" y="1780" font-size="21" fill="#53677e" font-weight="400">Cùng campaign = hash(eventIds đã chuẩn hóa).</text>
<text x="73" y="1811" font-size="21" fill="#53677e" font-weight="400">active &lt; 200; recent trong 60 giây &lt; 120.</text>
<text x="73" y="1842" font-size="21" fill="#53677e" font-weight="400">rank &lt; ceil(120 / 60) = 2 theo cấu hình mặc định.</text>
<text x="73" y="1873" font-size="21" fill="#53677e" font-weight="400">Được cấp: remove queue; add active + recent;</text>
<text x="73" y="1904" font-size="21" fill="#53677e" font-weight="400">ghi state=admitted và admittedAt.</text>
<text x="73" y="1935" font-size="21" fill="#53677e" font-weight="400">Lease active: now + 600 giây.</text>
<text x="73" y="1966" font-size="21" fill="#53677e" font-weight="400">Các ngưỡng tính theo campaign, không toàn hệ thống.</text>
<rect x="905" y="1705" width="760" height="303" rx="10" fill="#f8fbfd" stroke="#218167" stroke-width="1.6"/>
<text x="925" y="1737" font-size="23" fill="#218167" font-weight="700">JWT PAYLOAD &amp; KEY</text>
<text x="928" y="1780" font-size="21" fill="#53677e" font-weight="400">entryId · eventIds · userId · fingerprintHash</text>
<text x="928" y="1811" font-size="21" fill="#53677e" font-weight="400">type=waiting-room-access · jti · iat · exp</text>
<text x="928" y="1842" font-size="21" fill="#53677e" font-weight="400">iss=ticketstage-waiting-room</text>
<text x="928" y="1873" font-size="21" fill="#53677e" font-weight="400">aud=ticketstage-booking</text>
<text x="928" y="1904" font-size="21" fill="#53677e" font-weight="400">Ký HMAC theo jsonwebtoken mặc định (HS256).</text>
<text x="928" y="1935" font-size="21" fill="#53677e" font-weight="400">WAITING_ROOM_TOKEN_SECRET, fallback JWT_SECRET.</text>
<text x="928" y="1966" font-size="21" fill="#53677e" font-weight="400">JWT được ký, không mã hóa payload.</text>
<rect x="1730" y="1705" width="820" height="303" rx="10" fill="#f8fbfd" stroke="#28649d" stroke-width="1.6"/>
<text x="1750" y="1737" font-size="23" fill="#28649d" font-weight="700">TOKEN QUA CÁC AZ</text>
<text x="1753" y="1780" font-size="21" fill="#53677e" font-weight="400">Join ở AZ A, poll ở AZ B vẫn đọc cùng Redis.</text>
<text x="1753" y="1811" font-size="21" fill="#53677e" font-weight="400">Token do pod B ký được gateway C kiểm tra.</text>
<text x="1753" y="1842" font-size="21" fill="#53677e" font-weight="400">Mọi verifier phải có cùng secret đúng phiên bản.</text>
<text x="1753" y="1873" font-size="21" fill="#53677e" font-weight="400">Client gửi token trong header khi tạo booking.</text>
<text x="1753" y="1904" font-size="21" fill="#53677e" font-weight="400">Gateway không cần sticky session để verify JWT.</text>
<text x="1753" y="1935" font-size="21" fill="#53677e" font-weight="400">Unique index MongoDB là chốt chống dùng lại.</text>
<text x="1753" y="1966" font-size="21" fill="#53677e" font-weight="400">jti khác nhau không bỏ qua unique entryId.</text>
<rect x="50" y="2050" width="2500" height="285" rx="10" fill="#fffbf4" stroke="#d3750e" stroke-width="1.6" stroke-dasharray="10 6"/>
<text x="70" y="2082" font-size="23" fill="#d3750e" font-weight="700">GIỚI HẠN HIỆN TẠI CẦN ĐỌC CÙNG SƠ ĐỒ</text>
<text x="70" y="2113" font-size="20" fill="#53677e" font-weight="400">Đây là mô tả code hiện tại, không coi các bước hardening là đã hoàn thành.</text>
<text x="75" y="2143" font-size="22" fill="#53677e" font-weight="400">TTL: mỗi poll admitted ký lại JWT +600s; exp có thể vượt thời điểm hết lease. Gateway hiện không kiểm tra lại lease Redis.</text>
<text x="75" y="2176" font-size="22" fill="#53677e" font-weight="400">Owner: /status xác thực login nhưng chưa đối chiếu entry.userId; fingerprintHash có trong JWT nhưng gateway chưa so sánh device.</text>
<text x="75" y="2209" font-size="22" fill="#53677e" font-weight="400">Capacity: booking thành công không xóa active lease; slot thu hồi theo expiry khi có poll. Mongo unique index không ghi Redis state=used.</text>
<text x="75" y="2242" font-size="22" fill="#53677e" font-weight="400">Fairness: FIFO theo timestamp + random tie-break; stale queue member chưa được dọn và campaign theo tập event có thể chia nhỏ quota.</text>
<text x="75" y="2275" font-size="22" fill="#53677e" font-weight="400">Phân phối: token chỉ trả về khi client poll; chưa có SSE/WebSocket, key rotation theo kid, revoke list hoặc handshake lease tại booking.</text>
<text x="55" y="2393" font-size="20" fill="#53677e" font-weight="400">Nguồn: waitingRoomService.js, waitingRoomToken.js, api-gateway/server.js, bookingService.js và frontend Checkout.tsx.</text></g></svg>